[package]
name = "lhm-panel"
version = "1.2.1"
edition = "2021"
description = "Lightweight desktop hardware monitor panel that reads sensors from LibreHardwareMonitor"
license = "MIT"
repository = "https://github.com/halucino/lhm-panel"
readme = "README.md"
keywords = ["hardware", "monitor", "temperature", "librehardwaremonitor", "egui"]
categories = ["gui"]

[[bin]]
name = "lhm-panel"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wmi = "0.18"
tray-icon = "0.26"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
